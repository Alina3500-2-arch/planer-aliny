<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Планер Алины</title><style>
:root{--v:#7666ff;--bg:#f5f5fb;--m:#9b9ba4}*{box-sizing:border-box}body{margin:0;background:#e9e9f2;color:#17171d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{min-height:100vh;display:flex;justify-content:center;padding:20px 8px}.app{width:min(100%,430px);background:var(--bg);min-height:100vh;border-radius:38px;padding:24px 16px 105px;position:relative;overflow:hidden;box-shadow:0 25px 70px #34344c22}.top{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin-bottom:20px}.top button{border:0;background:none;font-size:24px}.title{text-align:center}.title h1{font-size:27px;margin:0}.title p{color:var(--m);margin:5px 0 0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:20px}.week button{border:0;background:none;border-radius:18px;padding:10px 2px}.week button.on{background:#ddd8ff}.week span{display:block;color:var(--m);font-size:13px}.week b{display:block;margin-top:7px;font-size:18px}.card{background:#fff;border-radius:27px;padding:18px;margin-bottom:15px;box-shadow:0 8px 24px #30304408}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.head i{font-style:normal;width:34px;height:34px;border-radius:11px;background:#efecff;color:var(--v);display:grid;place-items:center}.head h2{font-size:22px;margin:0}.head em{font-style:normal;color:var(--m)}.head button{margin-left:auto;border:0;background:none;color:var(--v);font-size:29px}.row{display:flex;align-items:center;gap:12px;min-height:44px}.check{width:28px;height:28px;border:2px solid #aaa;border-radius:8px;background:white;color:white;font-weight:bold}.check.on{background:var(--v);border-color:var(--v)}.row.done span{text-decoration:line-through;color:var(--m)}.dots{margin-left:auto;display:flex;gap:4px}.dots b{width:9px;height:9px;border-radius:50%;background:#ededf0}.dots b.on{background:var(--v)}textarea{border:0;background:#f8f7f4;border-radius:16px;padding:14px;width:100%;min-height:68px;outline:none}.tomorrow{font-size:15px}.tomorrow:before{content:"";display:inline-block;width:8px;height:8px;background:#9b8cff;border-radius:50%;margin-right:10px}.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #eee}.tabs button{border:0;background:none;color:#777;font-size:19px}.tabs button small{display:block;font-size:9px}.tabs .sel{color:var(--v)}.tabs .add{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--v);color:#fff;font-size:30px}@media(max-width:460px){.stage{padding:0}.app{border-radius:0}.dots b{width:7px;height:7px}.row{font-size:15px}}
</style></head><body><main class="stage"><div class="app"><header class="top"><button>⚙</button><div class="title"><h1 id="dayTitle">Понедельник</h1><p><span id="dateTitle">20</span> июля</p></div><button>▦</button></header><nav class="week" id="week"></nav><section class="card"><div class="head"><i>↻</i><h2>Привычки</h2><em id="habitCount">0/3</em><button onclick="addHabit()">＋</button></div><div id="habits"></div></section><section class="card"><div class="head"><i>✓</i><h2>Задачи</h2><em id="taskCount">0/3</em><button onclick="addTask()">＋</button></div><div id="tasks"></div></section><section class="card"><div class="head"><i>▦</i><h2>Задачи на завтра</h2><em>1</em><button onclick="addTomorrow()">＋</button></div><div id="tomorrow"><p class="tomorrow">Позвонить клиенту в 11:00</p></div></section><section class="card"><div class="head"><i>✎</i><h2>Заметки</h2></div><textarea placeholder="Заметка самой себе…" oninput="localStorage.note=this.value"></textarea></section><footer class="tabs"><button class="sel">⌂<small>Сегодня</small></button><button>▦<small>Календарь</small></button><button class="add" onclick="addTask()">＋</button><button>▥<small>Статистика</small></button><button>◎<small>Профиль</small></button></footer></div></main><script>
const days=[["Пн","20","Понедельник"],["Вт","21","Вторник"],["Ср","22","Среда"],["Чт","23","Четверг"],["Пт","24","Пятница"],["Сб","25","Суббота"],["Вс","26","Воскресенье"]];let selected=0;let habitItems=["Вставать в 6 утра","Читать 20 минут","Аффирмации и цели"].map(title=>({title,done:false}));let tasks=["Подготовить отчёт","Тренировка в зале","Купить продукты"].map(title=>({title,done:false}));
function drawWeek(){week.innerHTML=days.map((d,i)=>`<button class="${i===selected?'on':''}" onclick="selected=${i};dayTitle.textContent='${d[2]}';dateTitle.textContent='${d[1]}';drawWeek();drawHabits()"><span>${d[0]}</span><b>${d[1]}</b></button>`).join('')}
function drawHabits(){document.querySelector('#habits').innerHTML=habitItems.map((h,i)=>`<div class="row"><button class="check ${h.done?'on':''}" onclick="habitItems[${i}].done=!habitItems[${i}].done;drawHabits()">${h.done?'✓':''}</button><span>${h.title}</span><div class="dots">${days.map((_,x)=>`<b class="${h.done&&x===selected?'on':''}"></b>`).join('')}</div></div>`).join('');habitCount.textContent=`${habitItems.filter(x=>x.done).length}/${habitItems.length}`}
function drawTasks(){document.querySelector('#tasks').innerHTML=tasks.map((t,i)=>`<div class="row ${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="tasks[${i}].done=!tasks[${i}].done;drawTasks()">${t.done?'✓':''}</button><span>${t.title}</span></div>`).join('');taskCount.textContent=`${tasks.filter(x=>x.done).length}/${tasks.length}`}
function addHabit(){let v=prompt('Название привычки');if(v&&v.trim()){habitItems.push({title:v.trim(),done:false});drawHabits()}}function addTask(){let v=prompt('Новая задача');if(v&&v.trim()){tasks.push({title:v.trim(),done:false});drawTasks()}}function addTomorrow(){let v=prompt('Задача на завтра');if(v&&v.trim())document.querySelector('#tomorrow').insertAdjacentHTML('beforeend',`<p class="tomorrow">${v.trim()}</p>`)}drawWeek();drawHabits();drawTasks();document.querySelector('textarea').value=localStorage.note||'';
</script></body></html>
