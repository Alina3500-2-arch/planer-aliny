<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Планер Алины</title><style>.dots{gap:6px!important;flex-shrink:0}.dots b{width:17px!important;height:17px!important}#habits .row>span{max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:460px){.dots{gap:5px!important}.dots b{width:15px!important;height:15px!important}#habits .row>span{max-width:112px}}</style><style>
:root{--v:#8278ff;--bg:#f5f5fa;--m:#aaaab0}*{box-sizing:border-box}body{margin:0;background:#e9e9f1;color:#111117;font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,sans-serif;font-weight:500;letter-spacing:-.16px}.stage{min-height:100vh;display:flex;justify-content:center;padding:20px 8px}.app{width:min(100%,430px);background:var(--bg);min-height:100vh;border-radius:40px;padding:28px 18px 106px;position:relative;overflow:hidden;box-shadow:0 28px 80px #34344c1a}.top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin:1px 0 22px}.top button{border:0;background:none;font-size:27px;font-weight:400}.title{text-align:center}.title h1{font-size:28px;line-height:1.05;margin:0;font-weight:760;letter-spacing:-.8px}.title p{color:#a0a0a7;margin:6px 0 0;font-size:15px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:24px}.week button{border:0;background:none;border-radius:21px;padding:12px 2px;font-family:inherit}.week button.on{background:#d9d6ff}.week span{display:block;color:#b2b2b7;font-size:14px;font-weight:600}.week b{display:block;margin-top:8px;font-size:19px;font-weight:650}.week button.on span{color:#554bb3}.card{background:#fff;border-radius:29px;padding:20px;margin-bottom:17px;box-shadow:0 7px 22px #37375005}.head{display:flex;align-items:center;gap:11px;min-height:38px;margin-bottom:14px}.head i{font-style:normal;width:36px;height:36px;border-radius:12px;background:#f0eeff;color:var(--v);display:grid;place-items:center;font-size:20px}.head h2{font-size:24px;line-height:1;margin:0;font-weight:760;letter-spacing:-.65px}.head em{font-style:normal;color:#adadb3;font-size:17px;font-weight:500}.head button{margin-left:auto;border:0;background:none;color:var(--v);font-size:31px;font-weight:300}.row{display:flex;align-items:center;gap:13px;min-height:47px;font-size:17px}.check{width:29px;height:29px;flex:0 0 29px;border:1.8px solid #b4b4b8;border-radius:8px;background:white;color:white;font-weight:bold}.check.on{background:var(--v);border-color:var(--v)}.row.done span{text-decoration:line-through;color:var(--m)}.dots{margin-left:auto;display:flex;gap:5px}.dots b{width:10px;height:10px;border-radius:50%;background:#efeff1}.dots b.on{background:var(--v)}textarea{font-family:inherit;font-size:16px;border:0;background:#faf8f3;border-radius:18px;padding:16px;width:100%;min-height:72px;outline:none;color:#444}textarea::placeholder{color:#c7c7cb}.tomorrow{font-size:16px}.tomorrow:before{content:"";display:inline-block;width:8px;height:8px;background:#9b8cff;border-radius:50%;margin-right:10px}.collapsible{padding-top:18px;padding-bottom:18px}.collapsible .head{margin-bottom:0;cursor:pointer}.collapsible .body{display:none;padding-top:13px}.collapsible.open .body{display:block}.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;background:#fffffff8;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #eeeeF2}.tabs button{border:0;background:none;color:#85858b;font-size:19px;font-family:inherit}.tabs button small{display:block;font-size:9px}.tabs .sel{color:var(--v)}.tabs .add{justify-self:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#9289ff,#6e60f7);color:#fff;font-size:31px;box-shadow:0 8px 18px #7666ff38}@media(max-width:460px){.stage{padding:0}.app{border-radius:0}.dots{gap:4px}.dots b{width:8px;height:8px}.row{font-size:16px}.head h2{font-size:23px}}
</style></head><body><main class="stage"><div class="app"><header class="top"><button>⚙</button><div class="title"><h1 id="dayTitle">Понедельник</h1><p><span id="dateTitle">20</span> июля</p></div><button>▦</button></header><nav class="week" id="week"></nav><section class="card"><div class="head"><i>↻</i><h2>Привычки</h2><em id="habitCount">0/3</em><button onclick="addHabit()">＋</button></div><div id="habits"></div></section><section class="card collapsible" id="todayCard"><div class="head" onclick="toggleCard('todayCard')"><i>✓</i><h2>Задачи</h2><em id="taskCount">0/3</em><button onclick="event.stopPropagation();addTask()">＋</button></div><div class="body" id="tasks"></div></section><section class="card collapsible" id="tomorrowCard"><div class="head" onclick="toggleCard('tomorrowCard')"><i>▦</i><h2>Задачи на завтра</h2><em>1</em><button onclick="event.stopPropagation();addTomorrow()">＋</button></div><div class="body" id="tomorrow"><p class="tomorrow">Позвонить клиенту в 11:00</p></div></section><section class="card"><div class="head"><i>✎</i><h2>Заметки</h2></div><textarea placeholder="Заметка самой себе…" oninput="localStorage.note=this.value"></textarea></section><footer class="tabs"><button class="sel">⌂<small>Сегодня</small></button><button>▦<small>Календарь</small></button><button class="add" onclick="addTask()">＋</button><button>▥<small>Статистика</small></button><button>◎<small>Профиль</small></button></footer></div></main><script>
const days=[["Пн","20","Понедельник"],["Вт","21","Вторник"],["Ср","22","Среда"],["Чт","23","Четверг"],["Пт","24","Пятница"],["Сб","25","Суббота"],["Вс","26","Воскресенье"]];let selected=0;let habitItems=["Вставать в 6 утра","Читать 20 минут","Аффирмации и цели"].map(title=>({title,done:false}));let tasks=["Подготовить отчёт","Тренировка в зале","Купить продукты"].map(title=>({title,done:false}));
function drawWeek(){week.innerHTML=days.map((d,i)=>`<button class="${i===selected?'on':''}" onclick="selected=${i};dayTitle.textContent='${d[2]}';dateTitle.textContent='${d[1]}';drawWeek();drawHabits()"><span>${d[0]}</span><b>${d[1]}</b></button>`).join('')}
function drawHabits(){document.querySelector('#habits').innerHTML=habitItems.map((h,i)=>`<div class="row"><button class="check ${h.done?'on':''}" onclick="habitItems[${i}].done=!habitItems[${i}].done;drawHabits()">${h.done?'✓':''}</button><span>${h.title}</span><div class="dots">${days.map((_,x)=>`<b class="${h.done&&x===selected?'on':''}"></b>`).join('')}</div></div>`).join('');habitCount.textContent=`${habitItems.filter(x=>x.done).length}/${habitItems.length}`}
function drawTasks(){document.querySelector('#tasks').innerHTML=tasks.map((t,i)=>`<div class="row ${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="tasks[${i}].done=!tasks[${i}].done;drawTasks()">${t.done?'✓':''}</button><span>${t.title}</span></div>`).join('');taskCount.textContent=`${tasks.filter(x=>x.done).length}/${tasks.length}`}
function toggleCard(id){document.getElementById(id).classList.toggle('open')}function addHabit(){let v=prompt('Название привычки');if(v&&v.trim()){habitItems.push({title:v.trim(),done:false});drawHabits()}}function addTask(){let v=prompt('Новая задача');if(v&&v.trim()){tasks.push({title:v.trim(),done:false});drawTasks();document.getElementById('todayCard').classList.add('open')}}function addTomorrow(){let v=prompt('Задача на завтра');if(v&&v.trim()){document.querySelector('#tomorrow').insertAdjacentHTML('beforeend',`<p class="tomorrow">${v.trim()}</p>`);document.getElementById('tomorrowCard').classList.add('open')}}drawWeek();drawHabits();drawTasks();document.querySelector('textarea').value=localStorage.note||'';
</script></body></html>
