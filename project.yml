name: AlinaPlanner
options:
  bundleIdPrefix: ru.alina
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  AlinaPlanner:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.alina.planner
        INFOPLIST_KEY_CFBundleDisplayName: "Планер Алины"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_ENTITLEMENTS: App/AlinaPlanner.entitlements
    dependencies:
      - target: AlinaPlannerWidgets
        embed: true
  AlinaPlannerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.alina.planner.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: true

